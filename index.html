<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="YLtSC69ua7CaCLFfkVC5io_FHkH15qR9ed6Z4OjvB9Q" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XZING Speed Test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c3aed'/><text x='50' y='68' font-size='52' font-weight='800' font-family='Arial' text-anchor='middle' fill='white'>XZ</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="networkCanvas"></canvas>
  <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>

  <div class="container">
    <div class="brand">
      <div class="logo">XZ</div>
      <h1>XZING Speed</h1>
    </div>
    <p class="subtitle">Fast • Accurate • Free Internet Speed Test</p>

    <div class="net-info">
      <span>IP: <strong id="ipAddr">...</strong></span>
      <span>ISP: <strong id="ispName">...</strong></span>
    </div>

    <div class="card">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="live-speed" id="liveSpeed">0.0</div>
      <div class="live-label" id="liveLabel">Mbps</div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Ping</div>
          <div class="metric-value" id="ping">—</div>
          <div class="metric-unit">ms</div>
        </div>
        <div class="metric">
          <div class="metric-label">Download</div>
          <div class="metric-value" id="download">—</div>
          <div class="metric-unit">Mbps</div>
        </div>
        <div class="metric">
          <div class="metric-label">Upload</div>
          <div class="metric-value" id="upload">—</div>
          <div class="metric-unit">Mbps</div>
        </div>
      </div>

      <div class="extra-metrics">
        <div class="extra-metric">
          <div class="metric-label">Jitter</div>
          <div class="metric-value" id="jitter">—</div>
          <div class="metric-unit">ms</div>
        </div>
        <div class="extra-metric">
          <div class="metric-label">Server</div>
          <div class="metric-value" style="font-size:0.95rem">Cloudflare</div>
        </div>
      </div>

      <div id="status">Ready when you are</div>

      <button class="btn" id="startBtn">
        <span class="spinner"></span>
        <span class="btn-text">Start Speed Test</span>
      </button>

      <div class="can-do-loading" id="canDoLoading">
        <div class="can-do-loading-text">Analyzing your speed...</div>
        <div class="can-do-dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="can-do" id="canDo">
        <div class="can-do-title">What can you do with this speed?</div>
        <div class="can-do-list" id="canDoList"></div>
      </div>
    </div>

    <p class="footer">
      Made by <a href="https://github.com/rjscripts505" target="_blank">XZING</a> · Powered by Cloudflare
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
