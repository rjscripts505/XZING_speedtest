<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiFi Speed Test</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #22c55e;
      --border: #2a2a3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse at top, #1e1b4b 0%, transparent 50%),
        radial-gradient(ellipse at bottom, #0f172a 0%, transparent 60%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }

    .metric {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      padding: 16px 8px;
      border: 1px solid var(--border);
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .metric-unit {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 500;
    }

    #status {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 24px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 260px;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn.loading .spinner {
      display: block;
    }

    .btn.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .progress-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 24px;
      overflow: hidden;
      display: none;
    }

    .progress-wrap.active {
      display: block;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WiFi Speed Test</h1>
    <p class="subtitle">Test your download, upload &amp; ping in the browser</p>

    <div class="card">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Ping</div>
          <div class="metric-value" id="ping">—</div>
          <div class="metric-unit">ms</div>
        </div>
        <div class="metric">
          <div class="metric-label">Download</div>
          <div class="metric-value" id="download">—</div>
          <div class="metric-unit">Mbps</div>
        </div>
        <div class="metric">
          <div class="metric-label">Upload</div>
          <div class="metric-value" id="upload">—</div>
          <div class="metric-unit">Mbps</div>
        </div>
      </div>

      <div id="status">Ready when you are</div>

      <button class="btn" id="startBtn">
        <span class="spinner"></span>
        <span class="btn-text">Start Speed Test</span>
      </button>
    </div>

    <p class="footer">
      Powered by Cloudflare Speed Test API
    </p>
  </div>

  <script type="module">
    import SpeedTest from "https://cdn.skypack.dev/@cloudflare/speedtest";

    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const pingEl = document.getElementById("ping");
    const downloadEl = document.getElementById("download");
    const uploadEl = document.getElementById("upload");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");

    let engine = null;

    function formatMbps(bps) {
      if (!bps || bps <= 0) return "—";
      return (bps / 1e6).toFixed(1);
    }

    function formatMs(ms) {
      if (ms == null || isNaN(ms)) return "—";
      return ms.toFixed(0);
    }

    function setLoading(loading) {
      startBtn.disabled = loading;
      startBtn.classList.toggle("loading", loading);
      progressWrap.classList.toggle("active", loading);
    }

    function updateProgress(pct) {
      progressBar.style.width = Math.min(100, Math.max(0, pct)) + "%";
    }

    startBtn.addEventListener("click", () => {
      // Reset UI
      pingEl.textContent = "—";
      downloadEl.textContent = "—";
      uploadEl.textContent = "—";
      statusEl.textContent = "Starting test...";
      updateProgress(5);
      setLoading(true);

      engine = new SpeedTest({ autoStart: false });

      let step = 0;
      const totalSteps = 8;

      engine.onRunningChange = (running) => {
        if (!running && engine.isFinished) {
          setLoading(false);
          updateProgress(100);
        }
      };

      engine.onResultsChange = ({ type }) => {
        step++;
        updateProgress(10 + (step / totalSteps) * 80);

        const summary = engine.results.getSummary();

        if (summary.latency != null) {
          pingEl.textContent = formatMs(summary.latency);
        }
        if (summary.download) {
          downloadEl.textContent = formatMbps(summary.download);
        }
        if (summary.upload) {
          uploadEl.textContent = formatMbps(summary.upload);
        }

        const labels = {
          latency: "Measuring ping...",
          download: "Testing download speed...",
          upload: "Testing upload speed...",
          packetLoss: "Checking packet loss..."
        };
        statusEl.textContent = labels[type] || "Testing...";
      };

      engine.onFinish = (results) => {
        const summary = results.getSummary();
        pingEl.textContent = formatMs(summary.latency);
        downloadEl.textContent = formatMbps(summary.download);
        uploadEl.textContent = formatMbps(summary.upload);

        statusEl.textContent = "Test complete!";
        setLoading(false);
        updateProgress(100);
      };

      engine.onError = (err) => {
        console.error(err);
        statusEl.textContent = "Error: " + (err.message || "Something went wrong");
        setLoading(false);
      };

      engine.play();
    });
  </script>
</body>
</html>
